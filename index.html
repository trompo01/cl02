<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bibliografía — #1</title>
  <style>
    :root{
      --bg:#0b0c0d;
      --metal:linear-gradient(135deg,#0f1112 0%, #1a1c1e 40%, #0f1112 100%);
      --accent:#00d4ff;
      --muted:#bfc6c9;
      --ease:cubic-bezier(.2,.85,.25,1);
      --split-stagger:0.04s;
      --split-dur:700ms;
    }
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
    body{
      background:radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.02), transparent 10%), var(--metal);
      color:#fff;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.35;
      padding:18px;
    }
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    h1{font-size:1.6rem;margin:6px 0;letter-spacing:0.02em}
    .title-split{display:inline-block;overflow:visible}
    .title-split span{display:inline-block;transform:translateY(16px);opacity:0}
    nav{display:flex;gap:10px;align-items:center}
    /* Sparkly 3D CTA */
    .cta{
      display:inline-grid;align-items:center;justify-items:center;
      grid-auto-flow:column;gap:12px;
      padding:14px 18px;border-radius:14px;
      background:linear-gradient(180deg,#15181a,#0d0f10);
      box-shadow:0 10px 30px rgba(0,0,0,0.7), 0 2px 0 rgba(255,255,255,0.02) inset;
      border:1px solid rgba(255,255,255,0.06);
      text-decoration:none;color:#fff;font-weight:700;
      transform:translateZ(0);
      position:relative;overflow:hidden;
    }
    .cta:active{transform:translateY(2px) scale(.995)}
    .cta .sparkle{position:absolute;inset:0;background:linear-gradient(90deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.18) 40%, rgba(255,255,255,0.02) 100%);mix-blend-mode:screen;pointer-events:none;filter:blur(6px);opacity:.9;animation:sweep 3s linear infinite}
    @keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(110%)}}
    .cta img{height:34px;width:34px;object-fit:cover;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,0.6)}
    .cta .words{display:inline-block;min-width:140px;text-align:center}
    /* alternating small words */
    .cta .alt{display:block;overflow:hidden;height:1.2em}
    .alt span{display:block;animation:altCycle 6s steps(1) infinite}
    @keyframes altCycle{
      0%{transform:translateY(0)}
      33%{transform:translateY(-100%)}
      66%{transform:translateY(-200%)}
      100%{transform:translateY(0)}
    }
    /* language buttons */
    .lang-row{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
    .lang-btn{padding:10px 14px;border-radius:12px;background:#111214;border:1px solid rgba(255,255,255,0.05);box-shadow:0 8px 20px rgba(0,0,0,0.6);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:10px}
    .lang-flag{height:18px;width:26px;background-size:cover;border-radius:3px}
    /* grid of 2x4 square buttons */
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
    .tile{
      aspect-ratio:1/1;border-radius:12px;overflow:hidden;
      background:#222;border:1px solid rgba(255,255,255,0.04);
      display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;position:relative;
      box-shadow:0 12px 30px rgba(0,0,0,0.7);
      transition:transform .18s var(--ease), box-shadow .18s var(--ease);
    }
    .tile:focus,.tile:hover{transform:translateY(-6px);box-shadow:0 22px 44px rgba(0,0,0,0.75)}
    .tile .img{position:absolute;inset:0;background-size:cover;background-position:center;filter:contrast(1.05) saturate(1.1)}
    .tile .label{position:relative;z-index:2;padding:6px 10px;background:linear-gradient(180deg,rgba(0,0,0,0.35),rgba(0,0,0,0.6));border-radius:8px;font-weight:700}
    footer{margin-top:18px;font-size:0.85rem;color:var(--muted)}
    /* small button grid used in other pages */
    .btn-grid{display:grid;gap:10px}
    .btn-small{display:inline-flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:#0e0f10;border:1px solid rgba(255,255,255,0.04);text-decoration:none;color:#fff}
    /* split text animation control via data attributes set by JS */
    /* responsive */
    @media(min-width:900px){h1{font-size:2.2rem}}
    @media(max-width:420px){.title-split{font-size:1.2rem}}
  </style>
</head>
<body>
  <header>
    <h1><span class="title-split" id="title">Bibliografía</span></h1>
    <nav>
      <a class="cta" id="main-cta" href="http://wa.link/21ft32" target="_blank" rel="noopener">
        <div class="sparkle" aria-hidden="true"></div>
        <img src="py.jpg" alt="py" />
        <div class="words">
          <div class="alt" aria-hidden="true">
            <span>AHORA</span>
            <span>COMPRALOS</span>
            <span>EN PARAGUAY</span>
          </div>
        </div>
      </a>
    </nav>
  </header>

  <main>
    <p style="margin-top:8px;color:var(--muted)"> </p>

    <section class="grid" aria-label="Seleccionar libro">
      <a class="tile" href="page2.html"><div class="img" style="background-image:url('vesp.jpg')"></div><div class="label">#2</div></a>
      <a class="tile" href="page6.html"><div class="img" style="background-image:url('crc.jpg')"></div><div class="label">#6</div></a>

      <a class="tile" href="page3.html"><div class="img" style="background-image:url('pesp.jpg')"></div><div class="label">#3</div></a>
      <a class="tile" href="page7.html"><div class="img" style="background-image:url('CRCENG.png')"></div><div class="label">#7</div></a>

      <a class="tile" href="page4.html"><div class="img" style="background-image:url('lamp.jpg')"></div><div class="label">#4</div></a>
      <a class="tile" href="page8.html"><div class="img" style="background-image:url('veng.jpg')"></div><div class="label">#8</div></a>

      <a class="tile" href="page5.html"><div class="img" style="background-image:url('EJDL.jpg')"></div><div class="label">#5</div></a>
      <a class="tile" href="page9.html"><div class="img" style="background-image:url('peng.jpg')"></div><div class="label">#9</div></a>
    </section>

    <div class="lang-row">
      <a class="lang-btn" id="es-btn" href="page2.html" aria-label="Español">
        <div class="lang-flag" id="es-flag" style="background-image:url('flag-es.png')"></div>
        <strong>ESPAÑOL</strong>
      </a>
      <a class="lang-btn" id="en-btn" href="page7.html" aria-label="English">
        <div class="lang-flag" id="en-flag" style="background-image:url('flag-us.png')"></div>
        <strong>ENGLISH</strong>
      </a>
    </div>
  </main>

  <audio id="bg-audio" src="drake.aac" loop playsinline></audio>

  <script>
    // Split text animation for heading
    (function(){
      const el = document.getElementById('title');
      const text = el.textContent.trim();
      el.textContent = '';
      for(let i=0;i<text.length;i++){
        const sp = document.createElement('span'); sp.textContent = text[i];
        sp.style.transition = "transform var(--split-dur) var(--ease), opacity var(--split-dur) var(--ease)";
        sp.style.transitionDelay = (i * parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--split-stagger'))) + 's';
        el.appendChild(sp);
      }
      // trigger after a small timeout
      requestAnimationFrame(()=>{setTimeout(()=>{Array.from(el.children).forEach((c)=>{c.style.transform='translateY(0)';c.style.opacity='1'})},120)});
    })();

    // Attempt autoplay audio; if blocked, add a user tap banner to resume
    (function(){
      const audio = document.getElementById('bg-audio');
      function tryPlay(){
        audio.play().catch(()=>{ /* blocked by browserAutoplayPolicy */});
      }
      tryPlay();
      document.addEventListener('click', tryPlay, {once:true});
      // for Safari on iOS ensure playsinline and muted fallback if necessary (we keep audible)
    })();

    // Language flags alternating (Spain, Paraguay, Argentina, Uruguay) for ES; (USA, UK, Australia) for EN
    (function(){
      const esFlags = ['flag-es.png','flag-py.png','flag-ar.png','flag-uy.png'];
      const enFlags = ['flag-us.png','flag-uk.png','flag-au.png'];
      let ei=0, eni=0;
      const eDiv=document.getElementById('es-flag'), enDiv=document.getElementById('en-flag');
      setInterval(()=>{eDiv.style.backgroundImage = `url('${esFlags[ei]}')`; ei=(ei+1)%esFlags.length},1200);
      setInterval(()=>{enDiv.style.backgroundImage = `url('${enFlags[eni]}')`; eni=(eni+1)%enFlags.length},1400);
    })();
  </script>
</body>
</html>
